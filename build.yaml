# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Left peripheral (for use with prospector dongle)
  - board: corne_min_left
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_min_left_for_prospector

  # Right peripheral (for use with prospector dongle)
  - board: corne_min_right
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_min_right_for_prospector

  # Prospector dongle central with display
  - board: seeeduino_xiao_ble
    shield: corne_min_dongle prospector_adapter
    artifact-name: prospector_for_corne_min

  # Settings reset (flash after main firmware if anything goes sideways)
  - board: corne_min_left
    shield: settings_reset
    artifact-name: corne_min_settings_reset
  - board: corne_min_right
    shield: settings_reset
    artifact-name: corne_min_right_settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: prospector_settings_reset