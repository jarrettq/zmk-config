# Prospector Dongle Configuration

# Display configuration
CONFIG_ZMK_DISPLAY=y

# Idle timeout for dongle logo screen (ms, default 30s)
# After this duration of inactivity, the display swaps to the idle logo.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Disable ambient light sensor (not all prospector builds have it)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n

# Set fixed brightness (0-100)
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Suppress Kconfig warnings (prospector module compatibility)
CONFIG_WARN_DEPRECATED=n
