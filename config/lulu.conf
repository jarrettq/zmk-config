# Lulu ZMK Board Configuration
# Split, RGB, and OLED settings based on QMK info.json

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_WS2812=y
CONFIG_ZMK_RGB_UNDERGLOW_NUM_LEDS=70
CONFIG_ZMK_RGB_UNDERGLOW_SPLIT_COUNT=35,35
CONFIG_ZMK_RGB_UNDERGLOW_MAX_BRIGHTNESS=150
CONFIG_ZMK_OLED_DISPLAY=y
CONFIG_ZMK_OLED_DISPLAY_ENABLED=y
CONFIG_ZMK_OLED_DISPLAY_DRIVER="ssd1306"
CONFIG_ZMK_OLED_DISPLAY_WIDTH=128
CONFIG_ZMK_OLED_DISPLAY_HEIGHT=32
CONFIG_ZMK_MATRIX_DIODE_DIRECTION="COL2ROW"
# Add any additional hardware settings as needed
